;
; The instrument banks of the OPN2 plugin, which tools/bankgen packs when the
; plugin is built. The list has the form of libADLMIDI's banks.ini. Each bank
; gives its format and its file: WOPN, or GYB or GEMS, which tools/bankgen
; converts as OPN2 Bank Editor reads them. It may also name a text on the bank
; (info), a license text that its sources leave out (license), and add a note
; (note). Paths are relative to the source tree. The plugin starts with the
; first bank.
;
; The banks marked greyzone are left out unless the plugin is built with
; ADLplug_GREYZONE_BANKS, like the banks of libADLMIDI's grey zone. Each of them
; carries instruments taken out of a game or another program. Whoever built the
; bank file may give their own work a license, and libOPNMIDI's readme files now
; say so for several of them, but the terms of the material the instruments come
; from are not known; the bank of MIDI2VGM even carries a statement from the
; person who published it, that the instruments were probably ripped from
; MegaDrive games. The banks that are not marked have terms of their own: the MIT
; License for the XG, DMXOPN2 and old GM banks, and the BSD 3-Clause License for
; fmmidi, with their texts in the readme of each bank.

[General]
banks = 12

[bank-0]
name     = "WOPN (XG bank by Wohlstand)"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/xg.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/xg-readme.txt"

[bank-1]
name     = "WOPN (DMXOPN2 bank by Papiezak and Sneakernets)"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/gs-by-papiezak-and-sneakernets.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/gs-by-papiezak-and-sneakernets-readme.txt"
license  = "resources/opn2/LICENSE-DMXOPN2.txt"
note     = "The license below is that of the DMXOPN2 repository that the readme names, https://github.com/sneakernets/DMXOPN2."

[bank-2]
name     = "WOPN (fmmidi)"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/fmmidi.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/fmmidi-readme.txt"

[bank-3]
name     = "GYB (WinFM)"
format   = GYB
file     = "thirdparty/OPN2BankEditor/Bank_Examples/GYB-nineko/Instruments_WinFM.gyb"
greyzone = true

[bank-4]
name     = "WOPN (MIDI2VGM)"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/Nineko.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/Nineko-readme.txt"
license  = "thirdparty/libOPNMIDI/fm_banks/Nineko.txt"
note     = "The text below calls the bank public domain, quoting the person who published it with MIDI2VGM; he adds that the instruments were probably ripped from MegaDrive games, which is why this bank stays in the grey zone."
greyzone = true

[bank-5]
name     = "GEMS (GEMS FMLib) :NON-GM:"
format   = GEMS
file     = "thirdparty/OPN2BankEditor/Bank_Examples/GEMS-FMLib/patch.bnk"
note     = "libOPNMIDI's fm_banks/gems-fmlib-gmize-readme.txt describes this set as the instruments that came with GEMS, the music creation system of Sega."
greyzone = true

[bank-6]
name     = "GEMS (GEMS Ship) :NON-GM:"
format   = GEMS
file     = "thirdparty/OPN2BankEditor/Bank_Examples/GEMS-Ship/patch.bnk"
greyzone = true

[bank-7]
name     = "WOPN (GEMS GM (Modded by Wohlstand))"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/gems-fmlib-gmize.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/gems-fmlib-gmize-readme.txt"
note     = "The readme below gives Wohlstand's own work on this bank the MIT License. The instruments it arranges came with GEMS, the music creation system of Sega, and the terms of those are not known, so the bank stays in the grey zone."
greyzone = true

[bank-8]
name     = "WOPN (TomSoft SegaMusic (Modded by Wohlstand))"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/Tomsoft.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/Tomsoft-readme.txt"
note     = "The readme below gives the bank file the MIT License, as the work of Jean-Pierre Cimalando, who captured the instruments. They were captured from TommyXie's SegaMusic program, and the terms of that program are not known, so the bank stays in the grey zone."
greyzone = true

[bank-9]
name     = "WOPN (Old GM bank by Wohlstand)"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/gm-old.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/readme.txt"
note     = "libOPNMIDI's commit 7bae872 (2019-01-11) renamed this bank from fm_banks/gm.wopn, of which the readme below speaks, and made gm.wopn a link to xg.wopn."

[bank-10]
name     = "WOPN (Doom 32X fixed (by Wohlstand))"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/Doom32x-fixx.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/Doom32x-fixx-readme.txt"
note     = "The readme below gives Wohlstand's own work on this bank the MIT License. The instruments were captured from Doom for the Sega 32X, and the terms of those are not known, so the bank is in the grey zone."
greyzone = true

[bank-11]
name     = "WOPN (Tiny Toon Adventures (by Wohlstand))"
format   = WOPN
file     = "thirdparty/libOPNMIDI/fm_banks/Tiny Toon Adventures.wopn"
info     = "thirdparty/libOPNMIDI/fm_banks/Tiny Toon Adventures-readme.txt"
note     = "The readme below gives Wohlstand's own work on this bank the MIT License. The instruments were captured from Tiny Toon Adventures for the Sega MegaDrive, and the terms of those are not known, so the bank is in the grey zone."
greyzone = true
