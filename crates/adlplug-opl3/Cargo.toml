[package]
name = "adlplug-opl3"
description = "ADLplug-Next OPL3, the project's own emulator core of the YMF262, which makes what the low-level core drawn from the chip's die makes, sample for sample: its pass over the slots in plain Rust, and written by hand in assembly for the levels of the processor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Its own code is the workspace's, under the GPL version 3 or later, the passes in
# assembly among it; src/ymf262.rs follows the code of YMF262-LLE, under the GPL
# version 2 or later, and of Nuked OPL3's counters, under the LGPL version 2.1 or
# later, and says which parts. The crate as a whole is under all three.
license = "GPL-3.0-or-later AND GPL-2.0-or-later AND LGPL-2.1-or-later"
repository.workspace = true
publish.workspace = true

[dependencies]
adlplug-cpu = { path = "../adlplug-cpu" }

# The measurements of the parts of a sample and of the other ways of writing
# the core's own code, for rust-speed's experiments (src/core/experiment.rs,
# examples/profile.rs), with what those ways take of the core besides: what
# derive last read for each lane.
[features]
experiment = []

[[example]]
name = "profile"
required-features = ["experiment"]

[lints]
workspace = true
