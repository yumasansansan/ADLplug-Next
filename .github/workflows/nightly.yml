#
# The Nightly release (plan D44), every day at 18:00 UTC when main has changed
# since the commit of the tag nightly, and on request:
#  - ci.yml runs every build and test on the commit and packs the Release
#    builds, with a deb package from each Ubuntu build (ci/package.sh);
#  - an AlmaLinux 10 container builds and tests the Release configurations for
#    the rpm packages (ci/package-rpm.sh);
#  - builds without the emulator cores that can be left out check that other
#    cores play in their place (the render.fallback tests);
#  - when all of those pass, the publish job replaces the pre-release "Nightly"
#    with the archive of each system, the packages and SHA256SUMS, and moves
#    the tag nightly to the commit (ci/publish.sh).
# A run on request can leave the release as it is; the files it would publish
# are kept as an artifact either way. Only the publish job can write to the
# repository. The packs go from job to job as artifacts, uploaded with
# actions/upload-artifact, pinned to the commit of its release, and downloaded
# with gh.

name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the Nightly release when every build and test passes (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes since the last Nightly
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.compare.outputs.build }}
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - name: Compare the commit with the tag nightly
        id: compare
        env:
          PUBLISH_ASKED: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          nightly=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/tags/nightly | cut -f 1)
          echo "commit $GITHUB_SHA on $GITHUB_REF, nightly at ${nightly:-(none)}"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$nightly" = "$GITHUB_SHA" ]; then
            echo "main has not changed since the last Nightly."
            build=false
          fi
          publish=false
          if [ "$PUBLISH_ASKED" = true ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  fallback:
    name: ${{ matrix.preset }} without ${{ matrix.without }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: adl-debug
            without: the optional cores
            options: >-
              -DUSE_NUKED_EMULATOR=OFF -DUSE_OPAL_EMULATOR=OFF -DUSE_JAVA_EMULATOR=OFF
              -DUSE_ESFMU_EMULATOR=OFF -DUSE_MAME_EMULATOR=OFF -DUSE_YMFM_EMULATOR=OFF
              -DUSE_NUKED_OPL2_LLE_EMULATOR=OFF -DUSE_NUKED_OPL3_LLE_EMULATOR=OFF
          - preset: opn-debug
            without: the optional cores
            options: >-
              -DUSE_NUKED_EMULATOR=OFF -DUSE_GENS_EMULATOR=OFF -DUSE_YMFM_EMULATOR=OFF
              -DUSE_NP2_EMULATOR=OFF -DUSE_MAME_2608_EMULATOR=OFF
              -DUSE_NUKED_OPN2_LLE_EMULATOR=OFF -DUSE_NUKED_OPNA_LLE_EMULATOR=OFF
          - preset: opn-debug
            without: the OPNA cores but MAME YM2608
            options: >-
              -DUSE_NP2_EMULATOR=OFF -DUSE_YMFM_EMULATOR=OFF -DUSE_NUKED_OPNA_LLE_EMULATOR=OFF

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git submodule update --init --depth 1 --jobs 4
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Build
        run: bash ci/build.sh "${{ matrix.preset }}" baseline ${{ matrix.options }}

      - name: Test
        run: bash ci/test.sh "${{ matrix.preset }}"

  rpm:
    name: rpm ${{ matrix.preset }} (almalinux:10, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    # AlmaLinux 10.2 of 2026-09-02; move the digest to update it.
    container: almalinux:10@sha256:957738702313e6ee452cdb17bc1431542c467be9a4e2f4da3b8e551b0ebb9677
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: [baseline, avx2]
        preset: [adl-release, opn-release]

    steps:
      - name: Check out
        run: |
          dnf install -y -q git
          git config --global core.autocrlf false
          git config --global --add safe.directory "$PWD"
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git submodule update --init --depth 1 --jobs 4
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Build
        run: bash ci/build.sh "${{ matrix.preset }}" "${{ matrix.arch }}" -DADLplug_INSTALL_LV2DIR=lib64/lv2

      - name: Test
        run: bash ci/test.sh "${{ matrix.preset }}" --no-gui

      - name: Pack
        run: bash ci/package-rpm.sh "${{ matrix.preset }}" "${{ matrix.arch }}" package

      - name: Keep the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-rpm-${{ matrix.arch }}-${{ matrix.preset }}
          path: package/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Nightly release
    needs: [changes, ci, fallback, rpm]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Download the packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts --pattern 'package-*'

      - name: Assemble the release
        run: bash ci/publish.sh assemble artifacts assets notes.md

      - name: Keep the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly
          path: |
            assets/
            notes.md
          if-no-files-found: error
          retention-days: 3

      - name: Replace the Nightly release
        if: needs.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/publish.sh release assets notes.md
