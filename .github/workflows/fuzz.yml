#
# The long fuzzing. Once a day, and whenever it is started by hand, every fuzz
# target of both plugins runs with libFuzzer, on Ubuntu (ci/fuzz.sh --with-long),
# in each of the three sanitizer builds: the one with the address sanitizer, the
# one with the thread sanitizer and the one with the memory sanitizer, no two of
# which a build can have. That includes the targets whose every input is heavy,
# which the short runs of a minute in CI leave out (.github/workflows/ci.yml).
# How long each target runs is twenty minutes for the daily run and the run's own
# choice when it is started by hand.
#
# The targets of a build are fuzzed by jobs side by side: the two whose corpora
# take the longest to replay, the measurement of an instrument and the synth that
# MIDI drives (ADLplug_FUZZ_HEAVY below), have a job each, and one more takes
# every other target. One job fuzzed all seven in turn until the memory
# sanitizer's builds outgrew the time a job is allowed, and one job then took the
# two heavy targets together until they outgrew it as well: a target replays its
# corpus before it is fuzzed and, when the run changed it, again when it is merged
# down (ci/fuzz.sh), and under that sanitizer one replay of the measurement's
# corpus came to 55 minutes and one of the synth's to 72.
#
# The build is the fuzz targets alone, with every coverage feature libFuzzer can
# steer by (ci/build.sh --fuzz-only). These runs are where the fuzzer has the
# time to use them; the plugin, which one of those features keeps from being
# loaded at all, is built and tested by the jobs of every push instead. It is
# built for the processor of the runner that fuzzes with it -- native, AVX-512
# at its whole width where the runner has it -- since each job builds what it
# runs and nothing but the corpus and the failed inputs goes from one runner to
# another.
#
# A run carries on from the corpus that the last decided run grew and kept as an
# artifact -- the last one that fuzzed at all, which is one the schedule or a
# hand started, and that passed or failed; when that is gone, it starts again
# from the seed inputs. The inputs that failed are kept as well, and the next
# run replays them before anything else, so that a failure lasts until it is
# fixed, not until fuzzing happens to miss it. While the last decided run has
# failed, CI's publish job makes no Nightly (ci/publish.sh fuzzing). An input
# that failed goes into fuzz/regressions with the commit that fixes it.
#
# Only gh and the one action that CI uses, actions/upload-artifact, pinned to
# the commit of its release, take part.

name: Fuzz

# How long each target is fuzzed is the run's to choose, and the name of the run
# says it, so that the list of runs shows what each one was worth. A run started
# by hand takes the choice; the daily one has no way to be given an input, so the
# twenty minutes below is what it uses. GitHub reads none of a workflow's own
# variables where the name of a run and the limit of a job are written, which is
# why the same default stands in each of them; and its expressions have no
# arithmetic at all, which is why the limits are a table and the seconds are the
# shell's to work out.
run-name: Fuzz, ${{ github.event.inputs.minutes || '20' }} minutes each

on:
  schedule:
    - cron: '27 17 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to fuzz each target
        type: choice
        default: '20'
        options: ['1', '5', '10', '15', '20', '30']

permissions:
  contents: read
  actions: read

# Two runs at once would carry over from the same corpus and race to keep it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The targets whose corpora take the longest to replay, each fuzzed by a job of
  # its own, which the job of every other target leaves out. A name here that is
  # no target of the build fails the jobs (ci/fuzz.sh), so that a target renamed
  # cannot fall out of the fuzzing without a word.
  ADLplug_FUZZ_HEAVY: ADLplug_fuzz_measurement,ADLplug_fuzz_midi_synth

jobs:
  # The parts each build's fuzzing is split into, worked out from the list above
  # so that the list is written once: "rest", and each heavy target by its name. A
  # matrix cannot read the workflow's env, and the output of a job it needs is
  # how a list of the workflow's reaches it.
  parts:
    name: the parts of the fuzzing
    runs-on: ubuntu-26.04
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - id: parts
        run: |
          parts='["rest"'
          IFS=, read -r -a heavy <<< "$ADLplug_FUZZ_HEAVY"
          for target in "${heavy[@]}"; do
            parts+=",\"$target\""
          done
          echo "parts=$parts]" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.preset }}, ${{ matrix.part }} (ubuntu-26.04)
    needs: parts
    runs-on: ubuntu-26.04
    # What each choice is allowed: a job's targets run one after another after a
    # build, and each replays its corpus when it starts and, when the run changed
    # it, again when the corpus is merged down, which under the memory sanitizer can
    # take longer than the time it is fuzzed. Ten times one target's time and half
    # an hour for the build is room for the five targets of the rest, and for one
    # heavy target by itself, and still stops a job that hangs after a time that has
    # to do with what was asked of it. Measured with the memory sanitizer, the
    # slowest of the builds, for twenty minutes a target: ADLplug-Next's other five
    # came to some two hours and OPNplug-Next's to some three, and the two heavy
    # ones together to more than the 230 minutes the table allows -- the synth's
    # merge was stopped at that limit -- where each by itself, with the build and a
    # merge, comes to two hours and three quarters at the most. A heavy target under
    # that sanitizer replays its corpus for more than an hour whatever it is asked
    # to fuzz for, so its job is never allowed less than 170 minutes: the build,
    # a replay and a merge of the synth's, with room to spare. The tables are worked
    # out here because an expression of GitHub's cannot multiply; every choice above
    # is a key of each, and none may go past the six hours that a job of a hosted
    # runner may take at the most.
    timeout-minutes: >-
      ${{ fromJSON(endsWith(matrix.preset, '-msan') && matrix.part != 'rest'
            && '{"1": 170, "5": 170, "10": 170, "15": 180, "20": 230, "30": 330}'
            || '{"1": 40, "5": 80, "10": 130, "15": 180, "20": 230, "30": 330}')[github.event.inputs.minutes || '20'] }}
    strategy:
      fail-fast: false
      matrix:
        preset: [adl-sanitize, opn-sanitize, adl-tsan, opn-tsan, adl-msan, opn-msan]
        part: ${{ fromJSON(needs.parts.outputs.parts) }}

    steps:
      - name: Check out
        run: |
          # The commit with its whole history, the submodules at depth 1. Git
          # keeps the files as committed, CRLF or LF, on every runner.
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git submodule update --init --depth 1 --jobs 4
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Build
        run: bash ci/build.sh --fuzz-only "${{ matrix.preset }}" native

      - name: Carry over the corpus and the inputs that failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fuzz-run/corpora fuzz-run/earlier
          # Only a run that fuzzed counts: this workflow is started by the
          # schedule or by hand, and a run of it on a push is one GitHub writes
          # down when it cannot read the file itself, which holds no corpus and
          # has no say in whether fuzzing passed.
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fuzz.yml --branch main \
            --status completed --limit 20 --json conclusion,databaseId,event \
            --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")
                       | select(.conclusion == "success" or .conclusion == "failure")][0].databaseId // empty')
          if [ -z "$last" ]; then
            echo "No earlier run: the corpus starts from the seed inputs."
            exit 0
          fi
          echo "Carrying over from run $last."
          # A target's corpus and the inputs that failed on it are in the artifacts
          # of the job that fuzzed it: those of any part of the build, whether the
          # run split its targets into these parts, into two, or not at all. With
          # a pattern, gh puts each artifact in a directory of its own name. This
          # job takes its own targets' from all of them and leaves every other
          # target's alone, so that no job carries along a copy of what another
          # one grows, and a target moved from one part to another keeps its
          # corpus.
          gh run download "$last" --repo "$GITHUB_REPOSITORY" --dir fuzz-run/kept/corpora \
            --name "fuzz-corpora-${{ matrix.preset }}" --pattern "fuzz-corpora-${{ matrix.preset }}-*" \
            || echo "Run $last kept no corpus: the corpus starts from the seed inputs."
          gh run download "$last" --repo "$GITHUB_REPOSITORY" --dir fuzz-run/kept/crashes \
            --name "fuzz-crashes-${{ matrix.preset }}" --pattern "fuzz-crashes-${{ matrix.preset }}-*" \
            || echo "Run $last kept no inputs that failed."
          shopt -s nullglob
          for manifest in "build/${{ matrix.preset }}/fuzz/"*.args; do
            target=$(basename "$manifest" .args)
            if [[ ",$ADLplug_FUZZ_HEAVY," == *",$target,"* ]]; then
              part=$target
            else
              part=rest
            fi
            if [ "$part" != "${{ matrix.part }}" ]; then
              continue
            fi
            for kept in fuzz-run/kept/corpora/*/"$target"; do
              mkdir -p "fuzz-run/corpora/$target"
              cp -R "$kept/." "fuzz-run/corpora/$target/"
            done
            for kept in fuzz-run/kept/crashes/*/"$target"; do
              mkdir -p "fuzz-run/earlier/$target"
              cp -R "$kept/." "fuzz-run/earlier/$target/"
            done
          done
          rm -rf fuzz-run/kept

      - name: Fuzz each target
        env:
          ADLplug_FUZZ_MINUTES: ${{ github.event.inputs.minutes || '20' }}
        run: |
          if [ "${{ matrix.part }}" = rest ]; then
            select=(--skip "$ADLplug_FUZZ_HEAVY")
          else
            select=(--only "${{ matrix.part }}")
          fi
          # A heavy target under the memory sanitizer replays its corpus for more
          # than an hour before it fuzzes, which ci/fuzz.sh would take for a hang
          # after the hour it allows that sanitizer; it is given two.
          grace=()
          if [[ "${{ matrix.preset }}" == *-msan && "${{ matrix.part }}" != rest ]]; then
            grace=(--grace 7200)
          fi
          bash ci/fuzz.sh --with-long "${select[@]}" ${grace[@]+"${grace[@]}"} "${{ matrix.preset }}" \
            "$((ADLplug_FUZZ_MINUTES * 60))" fuzz-run/corpora fuzz-run/crashes fuzz-run/earlier

      # What a run found is kept whatever became of the job, its own time limit
      # included: a job that the limit stops counts as cancelled, and that is the
      # very run whose corpus and failing inputs are worth having.
      - name: Keep the corpus
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpora-${{ matrix.preset }}-${{ matrix.part }}
          path: fuzz-run/corpora/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep the inputs that failed
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.preset }}-${{ matrix.part }}
          path: fuzz-run/crashes/
          if-no-files-found: ignore
          retention-days: 90
