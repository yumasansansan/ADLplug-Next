#
# The long fuzzing. Once a day, and whenever it is started by hand, every fuzz
# target of both plugins runs with libFuzzer, on Ubuntu (ci/fuzz.sh --with-long),
# in each of the three sanitizer builds: the one with the address sanitizer, the
# one with the thread sanitizer and the one with the memory sanitizer, no two of
# which a build can have. That includes the targets whose every input is heavy,
# which the short runs of a minute in CI leave out (.github/workflows/ci.yml).
# How long each target runs is twenty minutes for the daily run and the run's own
# choice when it is started by hand.
#
# The targets of a build are fuzzed in parts side by side: the two whose corpora
# take the longest to replay, the measurement of an instrument and the synth
# that MIDI drives (ADLplug_FUZZ_HEAVY below), have a part each, and one more
# takes every other target. One job fuzzed all seven in turn until the memory
# sanitizer's builds outgrew the time a job is allowed, and one job then took
# the two heavy targets together until they outgrew it as well: a target replays
# its corpus before it is fuzzed and, when the run changed it, again when it is
# merged down (ci/fuzz.sh), and under that sanitizer one replay of the
# measurement's corpus came to 55 minutes and one of the synth's to 72, on one
# of AMD's Zen 3 or Zen 4 runners. That sanitizer is slow on AMD's Zen 3 and
# Zen 4 as neither of the others is, and each part is fuzzed on the kind of
# runner that is fast for its sanitizer where one can be had -- an Intel one or
# a later AMD one for the memory sanitizer, one with AVX-512 for the others --
# which it tries runners one after another for: .github/workflows/fuzz-part.yml,
# which does the fuzzing of a part and says what was measured.
#
# A run carries on from the corpus that the last decided run grew and kept as an
# artifact -- the last one that fuzzed at all, which is one the schedule or a
# hand started, and that passed or failed; when that is gone, it starts again
# from the seed inputs. The inputs that failed are kept as well, and the next
# run replays them before anything else, so that a failure lasts until it is
# fixed, not until fuzzing happens to miss it. While the last decided run has
# failed, CI's publish job makes no Nightly (ci/publish.sh fuzzing). An input
# that failed goes into fuzz/regressions with the commit that fixes it.
#
# Only gh and the one action that CI uses, actions/upload-artifact, pinned to
# the commit of its release, take part.

name: Fuzz

# How long each target is fuzzed is the run's to choose, and the name of the run
# says it, so that the list of runs shows what each one was worth. A run started
# by hand takes the choice; the daily one has no way to be given an input, so the
# twenty minutes below is what it uses. GitHub reads none of a workflow's own
# variables where the name of a run is written, which is why the same default
# stands there and where the choice is handed to each part; and its expressions
# have no arithmetic at all, which is why the limits of fuzz-part.yml are a table
# and the seconds are the shell's to work out.
run-name: Fuzz, ${{ github.event.inputs.minutes || '20' }} minutes each

on:
  schedule:
    - cron: '27 17 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to fuzz each target
        type: choice
        default: '20'
        options: ['1', '5', '10', '15', '20', '30']

permissions:
  contents: read
  actions: read

# Two runs at once would carry over from the same corpus and race to keep it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The targets whose corpora take the longest to replay, each fuzzed in a part
  # of its own, which the part of every other target leaves out. A name here that
  # is no target of the build fails the parts (ci/fuzz.sh), so that a target
  # renamed cannot fall out of the fuzzing without a word.
  ADLplug_FUZZ_HEAVY: ADLplug_fuzz_measurement,ADLplug_fuzz_midi_synth

jobs:
  # The parts each build's fuzzing is split into, worked out from the list above
  # so that the list is written once: "rest", and each heavy target by its name.
  # Neither a matrix nor a called workflow can read the workflow's env, and the
  # outputs of a job they need are how the list reaches them.
  parts:
    name: the parts of the fuzzing
    runs-on: ubuntu-26.04
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
      heavy: ${{ steps.parts.outputs.heavy }}
    steps:
      - id: parts
        run: |
          parts='["rest"'
          IFS=, read -r -a heavy <<< "$ADLplug_FUZZ_HEAVY"
          for target in "${heavy[@]}"; do
            parts+=",\"$target\""
          done
          echo "parts=$parts]" >> "$GITHUB_OUTPUT"
          echo "heavy=$ADLplug_FUZZ_HEAVY" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.preset }}, ${{ matrix.part }}
    needs: parts
    strategy:
      fail-fast: false
      matrix:
        preset: [adl-sanitize, opn-sanitize, adl-tsan, opn-tsan, adl-msan, opn-msan]
        part: ${{ fromJSON(needs.parts.outputs.parts) }}
    uses: ./.github/workflows/fuzz-part.yml
    with:
      preset: ${{ matrix.preset }}
      part: ${{ matrix.part }}
      heavy: ${{ needs.parts.outputs.heavy }}
      minutes: ${{ github.event.inputs.minutes || '20' }}
