version = 1

# ADLplug-Next's own.
[[annotations]]
path = "CMakePresets.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yuma Kakei <yumasansansan@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Inputs that once made a fuzz target fail, kept so that the fault stays fixed
# (fuzz/CMakeLists.txt). A fuzzer made them, or they were written from what it
# found; besides zeros, they hold only the words that open a WOPL or WOPN file,
# for the MIDI target a handful of bytes that name an emulator, a volume model
# and a note (fuzz/midi_synth.cc says what they mean), and for the state target
# the tags of a state, written by hand.
[[annotations]]
path = "fuzz/regressions/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yuma Kakei <yumasansansan@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The picture in the READMEs: a capture by Yuma Kakei of the two plugins as they
# are now. The interface it shows comes in part from ADLplug, whose graphics are
# under the Boost Software License, and in part from ADLplug-Next, whose changes
# are under the GPL. The picture itself is under CC BY-SA 4.0, as the pictures of
# the manual are.
[[annotations]]
path = "docs/screen.png"
precedence = "override"
SPDX-FileCopyrightText = [
    "2018-2019 Jean Pierre Cimalando",
    "2026 Yuma Kakei <yumasansansan@gmail.com>",
]
SPDX-License-Identifier = "BSL-1.0 AND GPL-3.0-or-later AND CC-BY-SA-4.0"

# Made for ADLplug, whose license, the Boost Software License, covers them.
[[annotations]]
path = [
    "resources/application/ADLplug*.png",
    "resources/application/ADLplug.icns",
    "resources/application/ADLplug.ico",
    "resources/application/*.rc",
    "resources/ui/cores/Nuked*.png",
    "resources/ui/cores/Nuked*.svg",
    "resources/ui/knob-skin.*",
]
precedence = "override"
SPDX-FileCopyrightText = "2018 Jean Pierre Cimalando"
SPDX-License-Identifier = "BSL-1.0"

